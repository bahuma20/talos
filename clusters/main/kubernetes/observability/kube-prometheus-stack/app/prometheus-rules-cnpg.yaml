apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: kube-prometheus-stack
  name: cnpg
spec:
  groups:
    - name: cnpg-alerts
      rules:
        - alert: CNPGBackupFailed
          # Prüft: Ist der Zeitstempel des neuesten fehlgeschlagenen Backups größer (jünger)
          # als der Zeitstempel des neuesten erfolgreichen Backups?
          expr: |
            max by (namespace) (
              kube_customresource_cnpg_backup_created 
              and on(name, namespace) kube_customresource_cnpg_backup_status_phase{phase="failed"} == 1
            ) 
            > 
            (
              max by (namespace) (
                kube_customresource_cnpg_backup_created 
                and on(name, namespace) kube_customresource_cnpg_backup_status_phase{phase="completed"} == 1
              ) 
              or on(namespace) max by (namespace) (kube_customresource_cnpg_backup_created) * 0
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CloudNativePG Backup ist fehlgeschlagen"
            description: "Das aktuellste CloudNativePG Backup im Namespace **{{ $labels.namespace }}** ist fehlgeschlagen und es gibt kein neueres erfolgreiches Backup."