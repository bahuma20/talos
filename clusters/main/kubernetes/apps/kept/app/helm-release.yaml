apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kept
  namespace: kept
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 21.3.8
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: kept
  values:
    TZ: Europe/Berlin
    image:
      repository: ghcr.io/ericerkz/kept
      tag: 1.9.7@sha256:44bbf3142690344a63ef38a3081e132986356b14419c65bbdb2aefad66a6fea9
    credentials:
      b2:
        type: s3
        url: ${VOLSYNC_B2_URL}
        accessKey: ${VOLSYNC_B2_ACCESS_KEY}
        secretKey: ${VOLSYNC_B2_SECRET_KEY}
        bucket: ${VOLSYNC_B2_BUCKET}
        encrKey: ${VOLSYNC_ENCRYPTION_KEY}
        path: ""
      aws:
        type: s3
        url: "https://s3.eu-central-1.amazonaws.com"
        accessKey: ${AWS_ACCESS_KEY}
        secretKey: ${AWS_SECRET_KEY}
        bucket: "talos-cnpg-backups"
        encrKey: ${AWS_ENCRYPTION_KEY}
        path: ""
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: notizen.base.noitl.space
        integrations:
          certManager:
            enabled: true
            certificateIssuer: ${CERTMANAGER_ISSUER}
          homepage:
            enabled: true
            group: Sonstige
            name: kept
            icon: mdi-note-text-outline
            description: Sowas wie Google Keep
            widget:
              enabled: false
    service:
      main:
        ports:
          main:
            port: 6767
            protocol: tcp
            targetPort: 6767
    persistence:
      data:
        enabled: true
        mountPath: /app/data
        volsync:
          - name: data
            type: restic
            credentials: b2
            src:
              enabled: true
            dest:
              enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                NODE_ENV: production
                PORT: 6767
                SQLITE_PATH: /app/data/kept.sqlite
                KEPT_SKIP_CHOWN: "1"
                KEPT_CORS_ORIGINS: "https://notizen.base.noitl.space"
                BASE_URL: "https://notizen.base.noitl.space"
                KEPT_OIDC_ISSUER: "https://cloud.noitl.space/index.php/.well-known/openid-configuration"
                KEPT_OIDC_CLIENT_ID: "4Rc1fNnErdttivZiDoKRiPZxiFv1jvT3Rh5okZZ2tatlX4mkdWtAWHa3mgk1JBe6"
                KEPT_OIDC_NAME: "Login mit Noitl.Cloud"
                KEPT_DISABLE_PASSWORD_LOGIN: 1
              envFrom:
                - secretRef:
                    name: environment
                    expandObjectName: false
    securityContext:
      container:
        UMASK: "0022"
        readOnlyRootFilesystem: false
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0